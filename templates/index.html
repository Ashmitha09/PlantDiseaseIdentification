{% extends "import.html" %} 
{% block content %}
<head>
    <link href="{{ url_for('static', filename='css/test.css') }}" rel="stylesheet">
</head>

<center>
   
<br><h2>Plant Disease Identification</h2><br>

    <form id="upload-file" method="post" enctype="multipart/form-data">
         <input style="border-radius: 5px;" type="file" name="file" class="btn btn-success" id="imageUpload" accept=".png, .jpg, .jpeg">
    </form>


    <div class="image-section" style="display:none;">
         <img id="imagePreview"  class="img-responsive" src="#" style="width:300px;height:300px;border-radius: 10px;"/><br><br>
         <div>
            <button type="button" class="btn btn-info btn-lg " id="btn-predict">Identify Disease</button>
         </div>
    </div>



    <div class="loader" style="display:none;"></div>

    <h3 id="result"class="btn btn-info btn-lg">
        <span> </span>
    </h3>


</center><br><br>

{% endblock %}
